<body>
  <script>
    let arr = [0, 1, 2, 3];

    // arr.unshift(1, 2, 3)
    // arr = [...arr, 1, 2, 3]

    // splice：
    // 第一个参数：从哪里开始删
    // 第二个参数：删几个？
    // 后续所有：在删除的地方，添加
    // arr.splice(0, 0, 1, 2, 3)
    arr.splice(1, 1, 666)

    console.log(arr)

    //  push('xx') 添加元素到数组末尾 返回新数组长度 
    //  pop('xx')  从数组中删除最后一个元素 返回删除的元素值

    //  splice(start, deleteCount, item1, item2...) 就地移除或替换已存在的元素和/或添加新的元素
    //  start 数组索引  deleteCount 需要删除的位数(0为不删除) item 添加或替换的数组元素

    //  shift() 删除数组第一个元素  返回删除的元素值
    //  unshift(item1, item2...) 将指定元素添加的数组开头 返回新数组长度
    //  sort() 数组排序
    //  reverse() 将数组元素反转 返回反转数组引用

  </script>
</body>
